# Cartrends AutoFlow — Render Blueprint
#
# CURRENT MODE: FREE (testing phase)
# ==================================
# Only the WEBHOOK RELAY runs on Render. The sales bot itself keeps running
# on your PC and pulls messages from the relay every few seconds.
#
#   customer -> Meta -> https://autoflow.onrender.com/webhook/wa  (this service)
#                            |  in-memory queue
#                            v
#                       your PC polls /pull every 3s  -> bot replies via Meta
#
# Why this is safe on the free plan:
#   * The relay is STATELESS — nothing important is stored here, so a
#     spin-down costs a short delay, not data. Meta retries deliveries.
#   * While the bot on your PC is running it polls every 3s, which keeps the
#     relay awake anyway.
#   * All real data (orders, learned parts, sale-loss log) stays in
#     data/state.json on your PC, where you can inspect it during testing.
#
# The one requirement: your PC must be running `npm start` to receive.
#
# LATER (production): switch to the full-bot service at the bottom of this
# file — always on, no PC needed. That needs a paid plan + disk. Moving over
# is a config change, not a rewrite.

services:
  - type: web
    name: autoflow                  # -> https://autoflow.onrender.com
    runtime: node
    plan: free
    region: singapore               # closest Render region to India
    branch: main
    rootDir: relay                  # only the relay folder is deployed
    buildCommand: npm install       # relay has zero dependencies; runs instantly
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: VERIFY_TOKEN
        sync: false                 # MUST equal WA_VERIFY_TOKEN in your .env
                                    # (cartrends-autoflow-verify-2026)
      - key: RELAY_SECRET
        sync: false                 # any long random string; the same value
                                    # goes in WEBHOOK_RELAY_SECRET on your PC

