<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartrends Bot Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1b1f24; --muted: #667085; --line: #e4e7ec;
    --accent: #1f5fbf; --ok: #127a3d; --ok-bg: #e5f5ec; --wait: #9a6200; --wait-bg: #fff4dc;
    --bad: #b42318; --bad-bg: #fde8e6; --info: #1f5fbf; --info-bg: #e7efff; --row-hover: #f8fafc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --ink: #e8eaed; --muted: #98a2b3; --line: #2a3038;
      --accent: #7aa7ff; --ok: #5fd08f; --ok-bg: #12301f; --wait: #f2c14e; --wait-bg: #33280f;
      --bad: #ff8a80; --bad-bg: #3a1714; --info: #7aa7ff; --info-bg: #16233d; --row-hover: #1c2129;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  main { padding: 16px 20px 40px; max-width: 1400px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .v { font-size: 26px; font-weight: 650; margin-top: 2px; }
  .card .d { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .tabs button, .chips button { border: 0; background: transparent; color: var(--ink); padding: 7px 12px; border-radius: 7px; cursor: pointer; font: inherit; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; font-size: 12px; }
  .chips button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button.dl { border: 1px solid var(--accent); background: var(--panel); color: var(--accent); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; }
  button.dl:hover { background: var(--accent); color: #fff; }
  input[type=search], input[type=password] { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 860px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); position: sticky; top: 0; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--row-hover); }
  tr.detail td { background: var(--row-hover); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 18px; font-size: 13px; }
  .grid div span { color: var(--muted); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .ok { color: var(--ok); background: var(--ok-bg); } .wait { color: var(--wait); background: var(--wait-bg); }
  .bad { color: var(--bad); background: var(--bad-bg); } .info { color: var(--info); background: var(--info-bg); }
  .muted { color: var(--muted); } .num { text-align: right; white-space: nowrap; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .login { max-width: 420px; margin: 80px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .login button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .err { color: var(--bad); margin-top: 8px; font-size: 13px; }
  .datebar select, .datebar input[type=date] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; }
  .datebar input[type=date]:disabled { opacity: .5; }
  .datebar label { display: inline-flex; gap: 6px; align-items: center; }
  .links { display: flex; gap: 14px; align-items: center; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .links a.muted { color: var(--muted); font-weight: 400; }
  .links a:hover { text-decoration: underline; }
  @media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <div><h1>Cartrends Bot Dashboard</h1><div class="sub" id="updated">—</div></div>
  <div class="sub">Customers · Orders · Discounts · Payments — refreshes every minute</div>
  <nav class="links"><a href="/" id="console-link">Console →</a><a href="/logout" class="muted">Sign out</a></nav>
</header>
<main id="app"></main>
<script>
(() => {
  const app = document.getElementById('app');
  let key = '';
  try { key = localStorage.getItem('dashKey') || ''; } catch (_) {}
  const q = new URLSearchParams(location.search).get('key');
  if (q) { key = q; try { localStorage.setItem('dashKey', q); } catch (_) {} history.replaceState(null, '', location.pathname); }

  let data = null, tab = 'customers', filter = 'all', search = '', open = new Set();

  // DATE FILTER (founder, 28 Sep): every tab, the cards and the downloads show
  // only what happened in the range picked. The day a row belongs to is the
  // day it was asked for (customers, discounts) or placed (orders, payments).
  // Days are the viewer's own (India) days: from 00:00 to 23:59:59.
  // EACH TAB ITS OWN RANGE (founder, 28 Sep: "filter of date on each tab …
  // to know how many customers were created / how many discounts approved on
  // that date"), and its own date to count by: a customer counts on the day it
  // was CREATED (decided), a discount on the day it was APPROVED - or, picked,
  // the day either was asked for.
  const DATE_BY = {
    customers: [['decidedAt', 'Created / decided'], ['requestedAt', 'Requested']],
    discounts: [['decidedAt', 'Approved / decided'], ['requestedAt', 'Requested']],
    orders: [['at', 'Placed']],
    payments: [['at', 'Date']],
  };
  const blankRange = (which) => ({ range: 'all', from: '', to: '', by: DATE_BY[which][0][0] });
  let ranges = { customers: blankRange('customers'), orders: blankRange('orders'), discounts: blankRange('discounts'), payments: blankRange('payments') };
  try {
    const saved = JSON.parse(localStorage.getItem('dashRanges') || 'null');
    if (saved) for (const k of Object.keys(ranges)) if (saved[k]) ranges[k] = { ...ranges[k], ...saved[k] };
  } catch (_) {}
  // Tab-scoped: `range`, `fromDay`, `toDay` below always mean the tab being read.
  let range = 'all', fromDay = '', toDay = '', byField = 'requestedAt';
  const useTab = (which) => { const r = ranges[which]; range = r.range; fromDay = r.from; toDay = r.to; byField = r.by; };
  const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function bounds() {
    const now = new Date();
    const start = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = 86400000;
    const today = start(now);
    switch (range) {
      case 'today': return [today, new Date(+today + day)];
      case 'yesterday': return [new Date(+today - day), today];
      case '7d': return [new Date(+today - 6 * day), new Date(+today + day)];
      case '30d': return [new Date(+today - 29 * day), new Date(+today + day)];
      case 'month': return [new Date(now.getFullYear(), now.getMonth(), 1), new Date(+today + day)];
      case 'lastmonth': return [new Date(now.getFullYear(), now.getMonth() - 1, 1), new Date(now.getFullYear(), now.getMonth(), 1)];
      case 'custom': {
        const f = fromDay ? new Date(fromDay + 'T00:00:00') : null;
        const t = toDay ? new Date(+new Date(toDay + 'T00:00:00') + day) : null;
        return [f, t];
      }
      default: return [null, null];
    }
  }
  // The date a row counts on, for the tab's "count by" choice. A request not
  // decided yet has no decided date: by that choice it is in no day's count.
  const dayOfRow = (x) => x[byField] || null;
  function inRange(which, x) {
    useTab(which);
    if (range === 'all') return true;
    const [f, t] = bounds();
    const v = dayOfRow(x);
    if (!v) return false;
    const ms = new Date(v).getTime();
    return (!f || ms >= +f) && (!t || ms < +t);
  }
  const rowsOf = (which) => (data[which] || []).filter((x) => inRange(which, x));
  // Day by day, for the range picked: how many of each status on each date.
  function byDay(which, list) {
    useTab(which);
    const days = new Map();
    for (const x of list) {
      const v = dayOfRow(x);
      if (!v) continue;
      const k = ymd(new Date(v));
      if (!days.has(k)) days.set(k, {});
      const d = days.get(k);
      d[x.status] = (d[x.status] || 0) + 1;
    }
    return [...days.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  }
  function rangeLabel() {
    if (range === 'all') return 'All time';
    const [f, t] = bounds();
    const show = (d) => d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    const last = t ? new Date(+t - 1) : null;
    if (f && last && ymd(f) === ymd(last)) return show(f);
    return (f ? show(f) : 'Start') + ' – ' + (last ? show(last) : 'today');
  }
  // The cards, counted from the rows in range - the same rules as the server.
  function summaryOf() {
    const c = rowsOf('customers'), o = rowsOf('orders'), d = rowsOf('discounts'), p = rowsOf('payments');
    const n = (list, st) => list.filter((x) => x.status === st).length;
    return {
      customers: { created: n(c, 'created'), waiting: n(c, 'waiting for approval'), rejected: n(c, 'rejected') },
      orders: { placed: n(o, 'placed'), waiting: n(o, 'waiting for approval') + n(o, 'waiting for payment'), rejected: n(o, 'rejected'), refused: n(o, 'refused by portal'), cancelled: n(o, 'cancelled on portal'), value: Math.round(o.filter((x) => x.status === 'placed').reduce((s, x) => s + (Number(x.amount) || 0), 0)) },
      discounts: { approved: n(d, 'approved'), waiting: n(d, 'waiting for approval') + n(d, 'waiting for Super Admin'), rejected: n(d, 'rejected') },
      payments: { settled: n(p, 'settled'), open: p.length - n(p, 'settled') },
    };
  }
  const saveRange = () => {
    ranges[tab] = { range, from: fromDay, to: toDay, by: byField };
    try { localStorage.setItem('dashRanges', JSON.stringify(ranges)); } catch (_) {}
  };
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const when = (iso) => iso ? new Date(iso).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const rs = (v) => v || v === 0 ? '₹' + Number(v).toLocaleString('en-IN', { maximumFractionDigits: 2 }) : '';
  // What the PORTAL says, with a line under it.
  const portalPill = (s, sub) => {
    if (!s) return '<span class="muted">—</span>';
    const cls = /^(on portal|invoiced|dispatched|approved|allocated|closed)$/i.test(s) ? 'ok' : /not found|refused|rejected|inactive|cancel/i.test(s) ? 'bad' : /pending|waiting|not on portal yet/i.test(s) ? 'wait' : 'info';
    return `<span class="pill ${cls}">${esc(s)}</span>${sub ? `<div class="muted" style="font-size:12px;margin-top:3px">${esc(sub)}</div>` : ''}`;
  };
  const pill = (s) => {
    const cls = /cancel/.test(s) ? 'bad' : /created|placed|approved|settled/.test(s) ? 'ok' : /reject|refused|not received|expired|inactive|not on portal/.test(s) ? 'bad' : /waiting|checking/.test(s) ? 'wait' : 'info';
    return `<span class="pill ${cls}">${esc(s)}</span>`;
  };

  function loginView(msg) {
    app.innerHTML = `<div class="login"><h2 style="margin-top:0">Dashboard key</h2>
      <p class="muted">Enter the dashboard key (DASHBOARD_KEY on the server).</p>
      <input type="password" id="k" placeholder="key" autofocus />
      <button id="go">Open</button>${msg ? `<div class="err">${esc(msg)}</div>` : ''}</div>`;
    const go = () => { key = document.getElementById('k').value.trim(); try { localStorage.setItem('dashKey', key); } catch (_) {} load(); };
    document.getElementById('go').onclick = go;
    document.getElementById('k').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }

  async function load() {
    if (!key) return loginView();
    try {
      const r = await fetch('/api/dashboard?key=' + encodeURIComponent(key));
      if (r.status === 401) { key = ''; try { localStorage.removeItem('dashKey'); } catch (_) {} return loginView('Wrong key.'); }
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
      data = await r.json();
      document.getElementById('updated').textContent = 'Updated ' + when(data.at);
      render();
    } catch (e) {
      app.innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
    }
  }

  const TABS = {
    customers: {
      label: 'Customers', statuses: ['created', 'waiting for approval', 'rejected'],
      cols: ['Requested', 'Customer', 'WhatsApp', 'Status (bot)', 'On the portal', 'Opened by', 'Approved / rejected by', 'Home branch'],
      row: (c) => [when(c.requestedAt), `<b>${esc(c.customer || '—')}</b><div class="muted">${esc(c.id)}</div>`, esc(c.phone), pill(c.status), portalPill(c.portalStatus, c.portal && c.portal.account ? 'account ' + c.portal.account : ''), esc(c.openedBy), esc(c.approvedBy || c.rejectedBy || '—'), esc(c.homeBranch || '')],
      detail: (c) => grid([
        ['Portal', c.portalStatus], ['Portal account id', c.portal && c.portal.account], ['Portal name', c.portal && c.portal.name], ['Portal dealer', c.portal && c.portal.dealer], ['Accounts on this number', c.portal && c.portal.accounts],
        ['GSTIN', c.gst], ['Business type', c.businessType], ['Contact', c.contactPerson], ['Contact phone', c.contactPhone],
        ['Email', c.email], ['Address', c.address], ['Home branch', c.homeBranch], ['Location', c.location],
        ['Owner DOB', c.dob], ['Bank', c.bank], ['Portal login', c.portalLogin], ['Odoo partner', c.odooPartner],
        ['Opened by', c.openedBy], ['Approved by', c.approvedBy], ['Rejected by', c.rejectedBy], ['Decided', when(c.decidedAt)], ['Note', c.note],
      ]),
    },
    orders: {
      label: 'Orders', statuses: ['placed', 'waiting for approval', 'waiting for payment', 'rejected', 'refused by portal', 'cancelled on portal'],
      cols: ['When', 'Order', 'Customer', 'Placed by', 'Status (bot)', 'On the portal', 'Approved / rejected by', 'Portal order', 'Amount'],
      row: (o) => [when(o.at), esc(o.id), `<b>${esc(o.customer || '—')}</b>`, esc(o.placedBy), pill(o.status) + ((o.status === 'refused by portal' || o.status === 'cancelled on portal') && o.note ? `<div class="muted" style="font-size:12px;margin-top:4px">${esc(o.note)}</div>` : ''), portalPill(o.portalStage, o.portal ? [o.portal.invoiceNo ? 'inv ' + o.portal.invoiceNo : '', o.portal.discount ? 'disc ' + o.portal.discount : ''].filter(Boolean).join(' · ') : ''), esc(o.approvedBy || o.rejectedBy || '—'), esc(o.portalOrder || '—'), `<span class="num">${rs(o.amount)}</span>`],
      detail: (o) => grid([
        ['Parts', o.lines], ['Customer portal id', o.customerId], ['Payment hold', o.paymentHold], ['Note', o.note],
        ['Portal status', o.portal && o.portal.status], ['DO status', o.portal && o.portal.doStatus], ['Invoice', o.portal && [o.portal.invoice, o.portal.invoiceNo].filter(Boolean).join(' · ')],
        ['Dispatch', o.portal && [o.portal.dispatch, o.portal.dispatchedAt ? when(o.portal.dispatchedAt) : ''].filter(Boolean).join(' · ')], ['Odoo SO', o.portal && o.portal.odooSo],
        ['Portal total', o.portal && o.portal.total != null ? rs(o.portal.total) : null], ['Discount on the portal', o.portal && o.portal.discount],
      ]),
    },
    discounts: {
      label: 'Discounts', statuses: ['approved', 'waiting for Super Admin', 'waiting for approval', 'expired', 'rejected', 'inactive on portal', 'not on portal'],
      cols: ['Requested', 'Request', 'Customer', 'Asked', 'Created by', 'Status (portal)', 'Portal rule'],
      row: (d) => [when(d.requestedAt), esc(d.id) + (d.source === 'portal' ? ' <span class="pill info" style="padding:0 6px">portal</span>' : ''), `<b>${esc(d.customer || '—')}</b>`, esc(d.asked), esc(d.createdBy), pill(d.status), d.portal && d.portal.rule ? `#${esc(d.portal.rule)} · ${esc(d.portal.on || '')} ${esc(d.portal.value || '')}` : '<span class="muted">—</span>'],
      detail: (d) => grid([
        ['Result', d.result], ['Decided', when(d.decidedAt)],
        ['Portal rule', d.portal && d.portal.rule], ['Portal name', d.portal && d.portal.name], ['Portal approval', d.portal && d.portal.approval],
        ['Valid from', d.portal && d.portal.validFrom ? when(d.portal.validFrom) : null], ['Valid to', d.portal && d.portal.validTo ? when(d.portal.validTo) : null], ['Dealer id', d.portal && d.portal.dealer],
      ]),
    },
    payments: {
      label: 'Payments', statuses: ['settled', 'checking', 'waiting for payment', 'not received'],
      cols: ['When', 'Request', 'Customer', 'Due', 'Status', 'Checked by'],
      row: (p) => [when(p.at), esc(p.id), `<b>${esc(p.customer || '—')}</b>`, `<span class="num">${rs(p.due)}</span>`, pill(p.status), esc(p.checkedBy || '—')],
      detail: (p) => grid([['Detail', p.detail], ['Received', p.received]]),
    },
  };
  function grid(pairs) {
    return `<div class="grid">${pairs.filter(([, v]) => v !== null && v !== undefined && v !== '').map(([k, v]) => `<div><span>${esc(k)}:</span> ${esc(v)}</div>`).join('') || '<div class="muted">No more details.</div>'}</div>`;
  }

  function render() {
    const s = summaryOf();
    // Each card counts over ITS tab's range, and says which.
    const lbl = (which) => { useTab(which); return `<div class="d" style="margin-top:6px"><span class="pill info" style="padding:0 6px">${esc(rangeLabel())}${range === 'all' ? '' : ' · by ' + esc((DATE_BY[which].find(([f]) => f === byField) || [, ''])[1].toLowerCase())}</span></div>`; };
    const cards = `<div class="cards">
      <div class="card"><div class="k">Customers</div><div class="v">${s.customers.created}</div><div class="d">created · ${s.customers.waiting} waiting · ${s.customers.rejected} rejected</div>${lbl('customers')}</div>
      <div class="card"><div class="k">Orders placed</div><div class="v">${s.orders.placed}</div><div class="d">${rs(s.orders.value)} · ${s.orders.waiting} waiting · ${s.orders.rejected} rejected${s.orders.refused ? ` · <span class="pill bad" style="padding:0 6px">${s.orders.refused} refused by portal</span>` : ' · 0 refused by portal'}${s.orders.cancelled ? ` · <span class="pill bad" style="padding:0 6px">${s.orders.cancelled} cancelled on portal</span>` : ' · 0 cancelled on portal'}</div>${lbl('orders')}</div>
      <div class="card"><div class="k">Discounts</div><div class="v">${s.discounts.approved}</div><div class="d">approved · ${s.discounts.waiting} waiting · ${s.discounts.rejected} rejected</div>${lbl('discounts')}</div>
      <div class="card"><div class="k">Payments</div><div class="v">${s.payments.settled}</div><div class="d">settled · ${s.payments.open} open</div>${lbl('payments')}</div>
    </div>`;
    const T = TABS[tab];
    const tabs = `<div class="tabs">${Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v.label} (${rowsOf(k).length})</button>`).join('')}</div>`;
    const inTab = rowsOf(tab); // leaves this tab's range in force below
    const list = inTab.filter((x) => (filter === 'all' || x.status === filter) && (!search || JSON.stringify(x).toLowerCase().includes(search)));
    useTab(tab);
    const PRESETS = [['all', 'All time'], ['today', 'Today'], ['yesterday', 'Yesterday'], ['7d', 'Last 7 days'], ['30d', 'Last 30 days'], ['month', 'This month'], ['lastmonth', 'Last month'], ['custom', 'Custom']];
    const byChoices = DATE_BY[tab];
    const dates = `<div class="bar datebar"><span class="muted" style="font-size:12px"><b>${esc(T.label)}</b> — date</span>
      <select id="rng">${PRESETS.map(([v, l]) => `<option value="${v}"${v === range ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <label class="muted" style="font-size:12px">From <input type="date" id="dFrom" value="${esc(fromDay)}"${range === 'custom' ? '' : ' disabled'} /></label>
      <label class="muted" style="font-size:12px">To <input type="date" id="dTo" value="${esc(toDay)}"${range === 'custom' ? '' : ' disabled'} /></label>
      ${byChoices.length > 1 ? `<label class="muted" style="font-size:12px">Count by <select id="byF">${byChoices.map(([f, l]) => `<option value="${f}"${f === byField ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>` : ''}
      <span class="pill info">${esc(rangeLabel())}</span></div>`;
    // DAY BY DAY, for a picked range: each date, and how many of each status.
    const days = range === 'all' ? [] : byDay(tab, list);
    const dayNames = [...new Set(days.flatMap(([, c]) => Object.keys(c)))];
    const perDay = days.length
      ? `<div class="panel" style="margin-bottom:12px"><table style="min-width:0"><thead><tr><th>Date</th>${dayNames.map((n) => `<th class="num">${esc(n)}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${days
          .map(([d, c]) => `<tr><td>${esc(new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }))}</td>${dayNames.map((n) => `<td class="num">${c[n] ? `<b>${c[n]}</b>` : '<span class="muted">0</span>'}</td>`).join('')}<td class="num"><b>${Object.values(c).reduce((a, b) => a + b, 0)}</b></td></tr>`)
          .join('')}</tbody></table></div>`
      : range === 'all' ? '' : '<div class="panel" style="margin-bottom:12px"><div class="empty">Nothing on these dates' + (byChoices.length > 1 && byField === 'decidedAt' ? ' (counted by the day it was decided)' : '') + '.</div></div>';
    const chips = `<div class="chips">${['all', ...T.statuses].map((st) => `<button data-f="${esc(st)}" class="${st === filter ? 'on' : ''}">${esc(st)}</button>`).join('')}</div>`;
    const rows = list.map((x, i) => {
      const id = tab + ':' + (x.id || i);
      const main = `<tr class="row" data-id="${esc(id)}">${T.row(x).map((c) => `<td>${c}</td>`).join('')}</tr>`;
      return open.has(id) ? main + `<tr class="detail"><td colspan="${T.cols.length}">${T.detail(x)}</td></tr>` : main;
    }).join('');
    // Where the portal did not answer, say so: those rows show the bot's record only.
    const down = Object.entries(data.sources || {}).filter(([, v]) => v !== 'ok');
    const warn = down.length ? `<div class="panel" style="padding:10px 14px;margin-bottom:12px;border-color:var(--wait)"><span class="pill wait">Portal</span> ${down.map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(' · ')} — showing the bot's own record for these.</div>` : '';
    app.innerHTML = warn + cards +
      `<div class="bar">${tabs}<input type="search" id="q" placeholder="Search name, phone, GSTIN, order, agent…" value="${esc(search)}" /></div>
       ${dates}${perDay}
       <div class="bar">${chips}<span style="flex:1"></span>
         <button class="dl" id="dl1" title="Every field of the rows shown below">⬇ Download CSV (${list.length})</button>
         <button class="dl" id="dlAll" title="One CSV per tab, with the search applied">⬇ Download all</button></div>
       <div class="panel">${list.length ? `<table><thead><tr>${T.cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">Nothing here.</div>'}</div>
       <p class="muted" style="font-size:12px">Click a row for every detail.</p>`;
    app.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; filter = 'all'; render(); }));
    app.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));
    app.querySelectorAll('tr.row').forEach((r) => (r.onclick = () => { const id = r.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); }));
    const rng = document.getElementById('rng');
    rng.onchange = () => {
      range = rng.value;
      if (range === 'custom' && !fromDay && !toDay) { const t = ymd(new Date()); fromDay = t; toDay = t; }
      saveRange();
      render();
    };
    const setDay = (which) => (e) => { if (which === 'from') fromDay = e.target.value; else toDay = e.target.value; range = 'custom'; saveRange(); render(); };
    document.getElementById('dFrom').onchange = setDay('from');
    document.getElementById('dTo').onchange = setDay('to');
    const byF = document.getElementById('byF');
    if (byF) byF.onchange = () => { byField = byF.value; saveRange(); render(); };
    const qi = document.getElementById('q');
    qi.oninput = () => { search = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
    document.getElementById('dl1').onclick = () => download(tab, list, filter);
    document.getElementById('dlAll').onclick = () => {
      Object.keys(TABS).forEach((k, i) =>
        setTimeout(() => download(k, rowsOf(k).filter((x) => !search || JSON.stringify(x).toLowerCase().includes(search)), 'all', k), i * 400),
      );
    };
  }

  // CSV DOWNLOAD — exactly the rows shown (tab, status filter, search), with
  // every field, not only the columns on screen. A byte-order mark so Excel
  // reads names and ₹ correctly.
  const HEAD = {
    id: 'Request / order', requestedAt: 'Requested', decidedAt: 'Decided', at: 'Date', status: 'Status', customer: 'Customer',
    customerId: 'Customer portal id', phone: 'WhatsApp', gst: 'GSTIN', businessType: 'Business type', contactPerson: 'Contact person',
    contactPhone: 'Contact phone', email: 'Email', address: 'Address', dob: 'Owner DOB', bank: 'Bank', location: 'Location',
    homeBranch: 'Home branch', openedBy: 'Opened by', approvedBy: 'Approved by', rejectedBy: 'Rejected by', portalLogin: 'Portal login',
    odooPartner: 'Odoo partner', note: 'Note', placedBy: 'Placed by', portalOrder: 'Portal order', lines: 'Parts', amount: 'Amount (Rs)',
    paymentHold: 'Payment hold', asked: 'Asked', result: 'Result', createdBy: 'Created by', due: 'Due (Rs)', detail: 'Detail',
    checkedBy: 'Checked by', received: 'Received',
  };
  const DATES = new Set(['requestedAt', 'decidedAt', 'at']);
  function csvCell(v) {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  // The portal's facts sit in a nested object: in the file each gets its own
  // column ("Portal: status", "Portal: invoiceNo" …).
  const flat = (r) => {
    const o = {};
    for (const [k, v] of Object.entries(r)) {
      if (v && typeof v === 'object' && !Array.isArray(v)) for (const [k2, v2] of Object.entries(v)) o[k + '.' + k2] = v2;
      else o[k] = v;
    }
    return o;
  };
  function download(which, rowsIn, flt) {
    const rows = rowsIn.map(flat);
    const keys = [];
    for (const r of rows) for (const k of Object.keys(r)) if (!keys.includes(k)) keys.push(k);
    // Nothing to export still gives the headings, so the file is recognisable.
    if (!keys.length) {
      const EMPTY = {
        customers: ['id', 'requestedAt', 'decidedAt', 'status', 'customer', 'phone', 'gst', 'openedBy', 'approvedBy', 'rejectedBy', 'homeBranch'],
        orders: ['id', 'at', 'status', 'customer', 'placedBy', 'approvedBy', 'rejectedBy', 'portalOrder', 'lines', 'amount'],
        discounts: ['id', 'requestedAt', 'decidedAt', 'status', 'customer', 'asked', 'result', 'createdBy', 'approvedBy', 'rejectedBy'],
        payments: ['id', 'at', 'customer', 'due', 'detail', 'status', 'checkedBy', 'received'],
      };
      keys.push(...(EMPTY[which] || ['id']));
    }
    const fmt = (k, v) => (DATES.has(k) && v ? new Date(v).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : v);
    const lines = [keys.map((k) => csvCell(HEAD[k] || (k.startsWith('portal.') ? 'Portal: ' + k.slice(7) : k))).join(',')];
    for (const r of rows) lines.push(keys.map((k) => csvCell(fmt(k, r[k]))).join(','));
    const blob = new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
    const day = new Date().toISOString().slice(0, 10);
    // The date range in the file name, so a download says which days it holds.
    useTab(which); // this file's own tab range, for its name
    const [bf, bt] = bounds();
    const span = range === 'all' ? null : (bf ? ymd(bf) : 'start') + '-to-' + (bt ? ymd(new Date(+bt - 1)) : day);
    const name = ['cartrends', which, flt && flt !== 'all' ? flt.replace(/\s+/g, '-') : null, span, search ? 'search-' + search.replace(/[^a-z0-9]+/gi, '-').slice(0, 20) : null, day].filter(Boolean).join('_') + '.csv';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  load();
  setInterval(() => { if (key && data) load(); }, 60000);
})();
</script>
</body>
</html>
